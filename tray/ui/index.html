<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Fleet</title>
<link rel="stylesheet" href="app.css"></head>
<body>

  <main>

      <button id="pick">Escolher arquivos<span class="key">Ctrl+O</span></button>

    <div id="results"></div>
  </main>
  <script src="panel.js"></script>
