[package]
name = "fleet-tray"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The point of giving kb a lib target in ADR-0009: the backend links the memory
# rather than shelling out to the CLI and parsing its stdout. Same process, no
# subprocess to spawn, monitor, restart or reap.
kb = { path = "../../kb" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
