# The claim "tests are green" becomes externally checkable the day the repo is public.
# Two platforms because the tool ships on Windows first and strangers clone on Linux.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kb:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/kb
      - name: Build
        run: cargo build --release --manifest-path tools/kb/Cargo.toml
      - name: Test
        run: cargo test --manifest-path tools/kb/Cargo.toml
      - name: The demo fleet routes and grades
        shell: bash
        run: |
          KB=tools/kb/target/release/kb
          [ -f "$KB.exe" ] && KB="$KB.exe"
          "$KB" check --all examples/demo
          "$KB" eval examples/demo/gold.tsv examples/demo --all | tee eval.out
          grep -q "10/10" eval.out
          grep -q "abstained on 3/3" eval.out

      # The JSON contract is what a program calls, so it is checked by parsing rather
      # than by reading. A shape nothing parses is a string that happens to have braces
      # in it, and the day a field is renamed the terminal output looks identical.
      # Linux only because the parser, not the shape, is what varies here: `jq` is on
      # the Ubuntu image and the Windows image is not worth assuming about. The JSON is
      # built by the same code on both.
      - name: route --json parses and carries the verdict
        if: runner.os == 'Linux'
        shell: bash
        run: |
          KB=tools/kb/target/release/kb
          [ -f "$KB.exe" ] && KB="$KB.exe"
          "$KB" index examples/demo --all
          "$KB" route "como faco rollback sem downtime" examples/demo --all --json > route.json
          jq -e '.verdict and (.results | length > 0) and (.results[0].passages | length > 0)' route.json
          # A miss is a shape too, and the one a caller is most likely to get wrong: it
          # must be a verdict of nothing with an empty result set, never an error.
          "$KB" route "quanto custa um satelite geoestacionario" examples/demo --all --json > miss.json
          jq -e '.verdict == "nothing" and (.results | length == 0)' miss.json
